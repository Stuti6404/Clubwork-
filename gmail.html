<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Code Recruitment</title>
</head>

<body style="
  margin: 0;
  padding: 0;
  background-color: #0b0b0f;
  font-family: Arial, Helvetica, sans-serif;
  color: #ffffff;
">

  <!-- Main wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color: #0b0b0f; margin: 0; padding: 30px 0;">
    <tr>
      <td align="center">

        <!-- Email container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="
                 width: 100%;
                 max-width: 600px;
                 background-color: #141419;
                 border-radius: 12px;
                 overflow: hidden;
                 border: 1px solid #292932;
               ">

          <!-- Banner -->
          <tr>
            <td>
              <img
                src="https://raw.githubusercontent.com/Stuti6404/Clubwork-/refs/heads/main/RecBanner.jpg"
                alt="OS Code Recruitment Banner"
                width="600"
                style="
                  display: block;
                  width: 100%;
                  max-width: 600px;
                  height: auto;
                  border: 0;
                "
              >
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 40px 35px 20px 35px;">

              <!-- Heading -->
              <h1 style="
                margin: 0 0 20px 0;
                font-size: 32px;
                line-height: 1.2;
                color: #ffffff;
                text-align: center;
                font-weight: 700;
              ">
                OS Code Recruitment
              </h1>

              <!-- Placeholder text -->
              <p style="
                margin: 0 0 30px 0;
                font-size: 18px;
                line-height: 1.6;
                color: #b8b8c2;
                text-align: center;
              ">
                Curiosity looks good on you
              </p>

              <!-- Placeholder paragraph -->
              <p style="
                margin: 0 0 30px 0;
                font-size: 15px;
                line-height: 1.7;
                color: #92929d;
                text-align: center;
              ">
                [  Open Source Code Club Recruitment ]
              </p>

              <!-- Button -->
              <table cellpadding="0" cellspacing="0" border="0" align="center">
                <tr>
                  <td align="center"
                      style="
                        border-radius: 8px;
                        background-color: #ffffff;
                      ">
                    <a
                      href="https://forms.gle/ofDG6b4Kdr4XzvBx8"
                      target="_blank"
                      style="
                        display: inline-block;
                        padding: 14px 30px;
                        font-size: 16px;
                        font-weight: bold;
                        color: #0b0b0f;
                        text-decoration: none;
                        border-radius: 8px;
                      "
                    >
                      Apply Now
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="
              padding: 20px 35px 30px 35px;
              text-align: center;
              border-top: 1px solid #292932;
            ">
              <p style="
                margin: 0;
                font-size: 12px;
                color: #666671;
              ">
                OS Code Recruitment
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
